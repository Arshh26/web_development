<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Jmart</title>
    <style>
      * {
        margin: 0px;
      }

      nav {
        background: linear-gradient(35deg, greenyellow, rgb(52, 12, 12));
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      nav > div > a {
        text-decoration: none;
        font-size: 20px;
        color: black;
        font-weight: bold;
      }

      nav > div > a:hover {
        text-decoration: underline;
      }

      @media screen and (min-width: 0px) and (max-width: 600px) {
        nav {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <h1>🛒Jmart</h1>
      <div id="links">
        <a href="#">Vegetables</a>
        <a href="#">Fruits</a>
        <a href="#">Groceries</a>
        <a href="#">Snacks</a>
      </div>
    </nav>
  </body>
</html>
