<!doctype html>
<html lang="en">
  <head>
    <title>Jspiders</title>
    <link rel="stylesheet" href="./../bootstrap-5.3.8-dist/css/bootstrap.css" />
  </head>
  <body>
    <nav class="navbar bg-warning navbar-dark navbar-expand-md">
      <div class="container-fluid">
        <h2 iclass="fw-bold navbar-brand">📃Jspiders</h2>
        <div>
          <button
            class="btn btn-light"
            data-bs-target="#login-modal"
            data-bs-toggle="modal"
          >
            Login
          </button>
        </div>
      </div>
    </nav>

    <div class="modal" id="login-modal">
      <div class="modal-dialog animate_animated animate_flipInx">
        <div class="modal-content">
          <div class="modal-header bg-warning">
            <h2>LogIn Here</h2>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-2">
                  <input
                    type="text"
                    placeholder="Enter Username / Email"
                    class="form-control"
                  />
                </div>
                <div class="mb-2">
                  <input
                    type="password"
                    placeholder="Enter Password"
                    class="form-control"
                  />
                </div>
                <div class="mb-2">
                  <input type="submit" class="btn btn-warning text-white" />
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./../bootstrap-5.3.8-dist/js/bootstrap.js"></script>
  </body>
</html>
