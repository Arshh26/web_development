<!doctype html>
<html lang="en">
  <head> </head>
  <body>
    <script>
      function greet() {
        console.log("Good Night");
      }
      greet();

      function greetName(name) {
        console.log("Good Night " + name);
      }
      greetName("Arshad");

      //Normal Function Decalartion

      function hello() {
        console.log("Hello");
      }
      hello();

      //function before its declaration

      bye();

      function bye() {
        console.log("Bye");
      }

      //Arrow Function

      let add = (a, b) => {
        return a + b;
      };
      console.log(add(5, 5));

      // IIFE (Immediate invoked function expression)

      (function multiply(a, b) {
        console.log(a * b);
      })(5, 5);

      // Formal Parameters and Actual Parameters

      function divide(a, b) {
        // formal parameters: which is declared at function declaration
        console.log(a / b);
      }
      divide(5, 2); // actual Parameters (Aarguments): which we pass while fuction calling

      //function overloading
      let add = (a, b) => {
        return a + b;
      };
      console.log(add(5, 5));

      function add(x, y, z) {
        return a + b + c;
      }
      console.log(add(5, 5, 5));

      // Argument Object

      function colors() {
        console.log(arguments[0]);
      }
      colors("Blue", "Red", "Pink");
    </script>
  </body>
</html>
