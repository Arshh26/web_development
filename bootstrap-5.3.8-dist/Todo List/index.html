<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="./../bootstrap-5.3.8-dist/css/bootstrap.css" />
  </head>
  <body>
    <section class="container-fluid mt-5">
      <div class="row">
        <div class="col-7 m-auto">
          <div class="card-header bg-dark text-white text-center">
            <h2>Items Need to Carry for Class</h2>
          </div>
          <div class="card-body">
            <form>
              <div class="mb-2">
                <input
                  type="text"
                  placeholder="Item Name"
                  class="form-control"
                />
              </div>
              <div class="mb-2">
                <input type="submit" class="btn btn-dark" />
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section class="container-fluid mt-5">
      <div class="row">
        <div class="col-7 m-auto">
          <div class="card">
            <div class="card-body">
            <ol class="list-group">
              <li class="list-group-item list-group-item-dark mb-2">
                <span class="fw-bold">Laptop</span>
                <button class="float-end">❌</button>
                <button class="float-end me-2">🖋️</button>
              </li>
            </ol>
          </div>
        </div>
      </div>

    </section>
  </body>
</html>
